# ---- 静态资源传输优化（2026-10-05 加）----
# 现象：首次打开「2.出货」2.7s、之后每次进入 1.15s。实测首次要拉 101 个静态资源、
# 主 chunk 1.4MB 且**未压缩**、所有响应**没有 Cache-Control**（浏览器每次都发条件请求 304 往返）。
# 这里开 gzip + 给带 hash 的构建产物加长缓存，纯配置改动、不动前端代码。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
# 列表接口响应 ~96KB，压缩后约 15KB。⚠️ 将来若加 SSE / 流式接口，需要去掉这一行。
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml application/xml+rss image/svg+xml;

server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 20m;

 # Vite 产物文件名带内容 hash：可以安全长缓存，二次访问直接命中本地缓存（0 请求）
 location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
 }

 # 入口与 SPA fallback 必须每次校验，否则会指向已被删除的 chunk（白屏）
 location = /index.html {
  add_header Cache-Control "no-cache";
 }

 location / {
  add_header Cache-Control "no-cache";
  try_files $uri $uri/ /index.html;
 }

 location /prod-api/ {
  proxy_pass http://backend:8080/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 300s;
 }
 location ~ ^/prod-api/(actuator|v3/api-docs|mcp)(/|$) { return 404; }
}
